# Local run on a Mac (Docker Desktop has no reliable host networking):
#     docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  coturn:
    network_mode: bridge
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49179:49160-49179/udp"
    environment:
      TURN_MIN_PORT: 49160
      TURN_MAX_PORT: 49179
      # Everything is in private ranges here; drop the production --denied-peer-ip list effect.
      TURN_EXTRA_ARGS: --allowed-peer-ip=10.0.0.0-10.255.255.255 --allowed-peer-ip=172.16.0.0-172.31.255.255 --allowed-peer-ip=192.168.0.0-192.168.255.255 --allow-loopback-peers
  caddy:
    environment:
      TURN_UPSTREAM: host.docker.internal:3478
